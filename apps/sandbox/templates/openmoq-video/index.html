<!doctype html>
<html lang="en">
  <head>
    <title>Sandbox — OpenMoQ Video</title>
  </head>
  <body class="bg-zinc-100 font-sans text-zinc-950">
    <main class="mx-auto flex max-w-4xl flex-col gap-4 p-4">
      <form id="connect" class="flex flex-wrap items-end gap-2 text-sm">
        <label class="flex flex-col">
          Relay URL
          <input name="url" class="rounded border px-2 py-1" size="28" required />
        </label>
        <label class="flex flex-col">
          Namespace
          <input name="ns" class="rounded border px-2 py-1" size="16" required />
        </label>
        <label class="flex flex-col">
          Draft
          <select name="v" class="rounded border px-2 py-1">
            <option>14</option>
            <option>16</option>
            <option>18</option>
            <option>22</option>
          </select>
        </label>
        <label class="flex flex-col">
          Cert hash (hex)
          <input name="hash" class="rounded border px-2 py-1" size="28" autocomplete="off" />
        </label>
        <button class="rounded bg-zinc-900 px-3 py-1 text-white">Connect</button>
        <button type="button" id="disconnect" class="rounded border px-3 py-1">Disconnect</button>
      </form>
      <p id="status" class="font-mono text-xs">Not connected.</p>
      <video-player>
        <video-skin class="sandbox-video-frame w-full">
          <openmoq-video class="block h-full w-full"></openmoq-video>
        </video-skin>
      </video-player>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
